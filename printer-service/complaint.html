<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Report a problem</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top"><div class="wrap">
    <a class="brand" href="index.html"><img data-company-logo hidden alt=""><span data-company-name>Service Portal</span></a>
    <div class="spacer"></div>
    <button class="btn ghost sm" data-lang-toggle type="button">العربية</button>
  </div></header>

  <main class="wrap narrow">
    <div id="loading" class="card muted" data-i18n="loading">Loading…</div>

    <div id="missing" class="card" hidden>
      <h2 data-i18n="reportProblem"></h2>
      <p id="missing-msg"></p>
      <p><a id="call-us" class="btn" href="#" hidden></a></p>
    </div>

    <form id="form" class="card" hidden novalidate>
      <h1 data-i18n="reportProblem">Report a printer problem</h1>
      <div class="printer-box" id="printer-box"></div>

      <div class="grid g2">
        <div class="field"><label for="name" data-i18n="yourName"></label><input id="name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="phone" data-i18n="yourPhone"></label><input id="phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel" placeholder="+971…"></div>
        <div class="field"><label for="email" data-i18n="yourEmail"></label><input id="email" name="email" type="email" autocomplete="email"></div>
        <div class="field"><label for="company" data-i18n="company"></label><input id="company" name="company" autocomplete="organization"></div>
      </div>

      <div class="field">
        <label data-i18n="issueType"></label>
        <div class="chips" id="issues"></div>
      </div>

      <div class="field"><label for="description" data-i18n="description"></label><textarea id="description" name="description" required></textarea></div>

      <div class="field">
        <label data-i18n="photos"></label>
        <span class="btn ghost sm file-btn">📷 <span data-i18n="addPhotos"></span><input id="photo-input" type="file" accept="image/*" multiple></span>
        <div class="previews" id="previews"></div>
      </div>

      <div class="err" id="form-err"></div>
      <button class="btn block" type="submit" id="submit-btn" data-i18n="submit">Submit complaint</button>
    </form>

    <div id="done" class="card" hidden>
      <h1 data-i18n="thanks">Complaint received!</h1>
      <p data-i18n="yourTicket"></p>
      <div class="big-ticket" id="ticket-id"></div>
      <p class="muted" data-i18n="thanksSub"></p>
      <div class="grid">
        <a class="btn" id="track-link" href="#" data-i18n="trackNow">Track status</a>
        <a class="btn wa" id="wa-company" href="#" target="_blank" rel="noopener" hidden>WhatsApp</a>
        <button class="btn ghost" type="button" id="again" data-i18n="newComplaint"></button>
      </div>
    </div>
  </main>

  <script type="module" src="js/complaint.js"></script>
</body>
</html>
