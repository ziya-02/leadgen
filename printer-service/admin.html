<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    #print-area { display: none; }
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; }
      body > *:not(#print-area) { display: none !important; }
      #print-area { display: block !important; }
    }
  </style>
</head>
<body>
  <header class="top"><div class="wrap">
    <a class="brand" href="index.html"><img data-company-logo hidden alt=""><span data-company-name>Service Portal</span></a>
    <div class="spacer"></div>
    <span class="muted small" data-user-name></span>
    <button class="btn ghost sm" data-lang-toggle type="button">العربية</button>
    <button class="btn ghost sm" data-logout type="button" data-i18n="logout" id="logout-btn" hidden>Log out</button>
  </div></header>

  <main class="wrap">
    <!-- login -->
    <form id="login" class="card narrow" style="margin:40px auto" hidden>
      <h1><span data-i18n="adminPortal">Admin portal</span></h1>
      <p class="muted" data-i18n="loginTitle"></p>
      <div class="field"><label for="l-email" data-i18n="email"></label><input id="l-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pw" data-i18n="password"></label><input id="l-pw" name="password" type="password" autocomplete="current-password" required></div>
      <div class="err" id="login-err"></div>
      <button class="btn block" data-i18n="login">Log in</button>
      <p class="muted small demo-hint" hidden>Demo: admin@demo.com / demo123</p>
    </form>

    <!-- app -->
    <div id="app" hidden>
      <nav class="tabs" id="tabs">
        <button data-tab="complaints" class="on"><span data-i18n="complaints"></span><span class="count" id="new-count" hidden></span></button>
        <button data-tab="printers" data-i18n="printers"></button>
        <button data-tab="techs" data-i18n="technicians"></button>
        <button data-tab="settings" data-i18n="settings"></button>
      </nav>

      <section data-pane="complaints">
        <div class="stats" id="stats"></div>
        <div class="row" style="margin-bottom:12px">
          <select id="c-filter" style="width:auto"></select>
          <input id="c-search" data-i18n-ph="search" style="max-width:320px">
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th data-i18n="ticketNo"></th><th data-i18n="date"></th><th data-i18n="printer"></th><th data-i18n="client"></th><th data-i18n="problem"></th><th data-i18n="technician"></th><th data-i18n="status"></th></tr></thead>
          <tbody id="c-body"></tbody>
        </table></div>
      </section>

      <section data-pane="printers" hidden>
        <div class="row" style="margin-bottom:12px">
          <span class="btn file-btn">⬆ <span data-i18n="importCsv"></span><input type="file" id="import-file" accept=".csv,.xlsx,.xls"></span>
          <button class="btn ghost" id="template-btn" type="button" data-i18n="downloadTemplate"></button>
          <button class="btn ghost" id="add-printer-btn" type="button" data-i18n="addPrinter"></button>
          <button class="btn ghost" id="print-qr-btn" type="button">🖨 <span data-i18n="printQr"></span> <span id="sel-count"></span></button>
        </div>
        <div class="row" style="margin-bottom:12px"><input id="p-search" data-i18n-ph="search" style="max-width:320px"><span class="muted small" id="p-total"></span></div>
        <div class="table-wrap"><table>
          <thead><tr><th><input type="checkbox" id="p-all" aria-label="Select all" style="width:18px;min-height:0"></th><th data-i18n="serial"></th><th data-i18n="brand"></th><th data-i18n="model"></th><th data-i18n="client"></th><th data-i18n="location"></th><th data-i18n="actions"></th></tr></thead>
          <tbody id="p-body"></tbody>
        </table></div>
      </section>

      <section data-pane="techs" hidden>
        <div class="row" style="margin-bottom:12px"><button class="btn" id="add-tech-btn" type="button" data-i18n="addTech"></button></div>
        <div class="table-wrap"><table>
          <thead><tr><th data-i18n="name"></th><th data-i18n="email"></th><th data-i18n="phone"></th><th data-i18n="active"></th><th data-i18n="dailyReport"></th><th data-i18n="actions"></th></tr></thead>
          <tbody id="t-body"></tbody>
        </table></div>
      </section>

      <section data-pane="settings" hidden>
        <form class="card" id="settings-form" style="max-width:720px">
          <div class="grid g2">
            <div class="field"><label data-i18n="companyName"></label><input name="companyName"></div>
            <div class="field"><label data-i18n="companyPhone"></label><input name="companyPhone" type="tel" placeholder="+971…"></div>
            <div class="field"><label data-i18n="companyEmail"></label><input name="companyEmail" type="email"></div>
            <div class="field"><label data-i18n="companyAddress"></label><input name="companyAddress"></div>
          </div>
          <div class="field"><label data-i18n="portalUrl"></label><input name="portalUrl" type="url" placeholder="https://"><p class="muted small" data-i18n="portalUrlHint"></p></div>
          <div class="field">
            <label data-i18n="logo"></label>
            <div class="row"><img id="logo-preview" alt="" style="max-height:60px;max-width:180px" hidden>
              <span class="btn ghost sm file-btn">⬆ <span data-i18n="logo"></span><input type="file" id="logo-file" accept="image/*"></span>
              <button type="button" class="btn danger sm" id="logo-clear" data-i18n="delete"></button></div>
          </div>
          <button class="btn" data-i18n="save">Save</button>
        </form>
      </section>
    </div>
  </main>

  <div id="print-area"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
